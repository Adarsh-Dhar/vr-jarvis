name: Update Test Dashboard

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: |
        cd jarvis-tests/test-runner
        pip install pyyaml
        python3 test_dashboard_enhanced.py
    - name: Check for new tools
      run: |
        cd jarvis-tests/test-runner
        python3 auto_test_generator.py --check
    - name: Deploy dashboard
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./test-reports/dashboard
