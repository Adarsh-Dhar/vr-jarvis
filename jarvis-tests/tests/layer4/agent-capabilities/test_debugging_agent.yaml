category: agent_capabilities
checks:
- correct_tool_selection
- correct_root_cause
- complete_failure_path
- evidence_support
- no_hallucinations
description: 'Test whether the Debugging Intelligence Agent can identify the root
  cause from a stack trace and available evidence.

  '
expected:
  actions:
  - Parse stack trace
  - Trace error propagation
  - Identify failure path
  - Inspect code at failure point
  - Identify root cause
  output_requirements:
  - Correct root cause identified
  - Failure path traced correctly
  - Supporting code evidence provided
  - No hallucinated causes
  status: skipped
  tool_selection:
  - analyze_stack_trace
  - trace_error_propagation
  - identify_failure_path
  - inspect_variables
  - get_source
layer: 4
name: Debugging Intelligence Agent - Identify Root Cause
severity: critical
task:
  agent: debugging_intelligence
  input: "Given this stack trace:\nTraceback (most recent call last):\n  File \"app.py\"\
    , line 45, in process_request\n    result = validate_input(data)\n  File \"validator.py\"\
    , line 12, in validate_input\n    return json.loads(raw_data)\njson.decoder.JSONDecodeError:\
    \ Expecting value: line 1 column 1 (char 0)\n\nIdentify the likely root cause\
    \ and provide supporting evidence.\n"
test_id: AGT-DBG-001
test_type: AGENT_CAPABILITY
tool: identify_root_cause
