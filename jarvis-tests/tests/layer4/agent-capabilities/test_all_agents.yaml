category: agent_capabilities
checks:
- correct_delegation
- parallel_execution_where_possible
- sequential_execution_where_necessary
- context_sharing
- correct_task_dependencies
- agent_failure_handling
- duplicate_task_prevention
- contradictory_findings_resolution
description: 'Test multi-agent coordination for a bug investigation scenario. Verify
  correct delegation, parallel execution, context sharing, and result aggregation.

  '
expected_coordination:
  agents:
  - name: repository_intelligence
    output: repository_overview
    tools:
    - detect_languages
    - detect_frameworks
    - identify_entry_points
  - input: repository_overview
    name: code_understanding
    output: authentication_logic
    tools:
    - explain_function
    - parse_function
    - extract_function_signature
  - input: authentication_logic
    name: relationship_intelligence
    output: connected_functions
    tools:
    - find_callers
    - find_callees
    - trace_call_chain
  - input: connected_functions
    name: runtime_intelligence
    output: failing_executions
    tools:
    - collect_execution_trace
    - record_function_calls
  - input: failing_executions
    name: debugging_intelligence
    output: root_cause
    tools:
    - identify_root_cause
    - trace_error_propagation
  - input: root_cause
    name: security_quality
    output: security_risks
    tools:
    - analyze_authentication
    - analyze_injection_risks
  - input: root_cause
    name: software_engineering
    output: fix_applied
    tools:
    - edit_file
    - run_tests
  - input: fix_applied
    name: testing_verification
    output: verification_results
    tools:
    - run_unit_tests
    - verify_compilation
  context_sharing:
  - "repository_overview \u2192 code_understanding"
  - "authentication_logic \u2192 relationship_intelligence"
  - "connected_functions \u2192 runtime_intelligence"
  - "failing_executions \u2192 debugging_intelligence"
  - "root_cause \u2192 security_quality"
  - "root_cause \u2192 software_engineering"
  - "fix_applied \u2192 testing_verification"
  orchestrator:
    action: create_investigation_plan
    delegates_to:
    - repository_intelligence
    - code_understanding
    - relationship_intelligence
    - runtime_intelligence
    - debugging_intelligence
    - security_quality
    - software_engineering
    - testing_verification
layer: 4
name: Multi-Agent Coordination - Bug Investigation
scenario: bug_investigation
severity: critical
task: Find why authentication fails intermittently, identify the root cause, fix it
  and verify the fix.
test_id: AGT-ALL-001
test_type: MULTI_AGENT_COORDINATION
