test_id: INT-git_commit-real-T01
name: Git commit on real repository
category: integration
tool: git_commit
layer: 3
test_type: T01
description: Integration test - git commit operations on real repository
fixture: simple-python
infrastructure:
  - temp_copy
  - git
input:
  message: "Test commit"
  files:
    - main.py
expected:
  status: ok
  commit_created: true
  commit_hash: not null
must_not:
  - git_error
  - repository_corrupted
checks:
  - type: content_validation
    required_content:
      - commit_hash
  - type: infrastructure_check
    git_was_real: true
  - type: isolation_check
    used_temp_copy: true
    shared_fixture_unchanged: true
performance:
  max_duration_ms: 2000
severity: critical
stub_should_fail: true
requires_real_infrastructure: true
