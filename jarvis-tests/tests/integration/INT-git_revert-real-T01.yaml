test_id: INT-git_revert-real-T01
name: Git revert on real repository
category: integration
tool: git_revert
layer: 3
test_type: T01
description: Integration test - git revert operations on real repository
fixture: simple-python
infrastructure:
  - temp_copy
  - git
input:
  commit_hash: HEAD~1
expected:
  status: ok
  revert_successful: true
  working_directory_clean: true
must_not:
  - git_error
  - repository_corrupted
  - merge_conflict
