test_id: INT-index_repository-real-T01
name: Index repository with real incremental indexing
category: integration
tool: index_repository
layer: 3
test_type: T01
description: Integration test - index repository with real incremental indexing
fixture: simple-python
infrastructure:
  - temp_copy
  - graph_store
input:
  repository_path: .
  incremental: false
expected:
  status: ok
  indexing_complete: true
  files_indexed:
    - main.py
    - subpackage/__init__.py
    - subpackage/helper.py
must_not:
  - indexing_error
  - graph_corrupted
checks:
  - type: content_validation
    required_content:
      - files_indexed
  - type: infrastructure_check
    graph_store_was_real: true
  - type: isolation_check
    used_temp_copy: true
performance:
  max_duration_ms: 30000
severity: critical
stub_should_fail: true
requires_real_infrastructure: true
