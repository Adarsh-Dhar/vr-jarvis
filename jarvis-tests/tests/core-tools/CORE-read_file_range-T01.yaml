test_id: CORE-read_file_range-T01
name: Read specific line range from main.py
category: core
tool: read_file_range
layer: 1
test_type: T01
description: Happy Path - read lines 4-10 (def alpha through def beta)
fixture: simple-python
input:
  file_path: fixtures/repositories/simple-python/main.py
  start_line: 4
  end_line: 10
expected:
  status: ok
  start_line: 4
  end_line: 10
  content_contains:
    - "def alpha():"
    - "def beta():"
  line_count: 7
must_not:
  - error
checks:
  - type: content_validation
    required_content:
      - "def alpha():"
      - "def beta():"
    forbidden_content:
      - "def target():"
checks:
  - type: content_validation
    required_content:
      - "def alpha():"
      - "def beta():"
    forbidden_content:
      - "def target():"
  - type: schema_validity
    required_fields:
      - status
      - file_path
      - start_line
      - end_line
      - content
performance:
  max_duration_ms: 500
severity: critical
