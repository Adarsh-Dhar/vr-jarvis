test_id: CORE-scan_secrets-T01
name: Detect hardcoded secrets in security-challenge fixture
category: core
tool: scan_secrets
layer: 1
test_type: T01
description: Happy Path - detect hardcoded API keys and credentials
fixture: security-challenge
input:
  repository_path: fixtures/repositories/security-challenge
expected:
  status: ok
  secrets_found_min: 3
  known_secrets_detected:
    - api_key
    - database_url
    - aws_secret_key
must_not:
  - error
checks:
  - type: content_validation
    required_content:
      - "api_key"
      - "database_url"
  - type: schema_validity
    required_fields:
      - status
      - secrets
performance:
  max_duration_ms: 2000
severity: critical
