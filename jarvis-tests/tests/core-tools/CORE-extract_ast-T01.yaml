test_id: CORE-extract_ast-T01
name: Extract AST from main.py
category: core
tool: extract_ast
layer: 1
test_type: T01
description: Happy Path - extract AST (alias for parse_source_code)
fixture: simple-python
input:
  file_path: fixtures/repositories/simple-python/main.py
expected:
  status: ok
  language: python
  ast_not_empty: true
must_not:
  - error
checks:
  - type: content_validation
    required_content:
      - "python"
  - type: schema_validity
    required_fields:
      - status
      - file_path
      - language
      - ast
  - type: non_empty_check
    fields:
      - ast
performance:
  max_duration_ms: 1000
severity: critical
