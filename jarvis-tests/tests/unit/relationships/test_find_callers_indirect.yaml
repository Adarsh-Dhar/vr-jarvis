category: relationship_intelligence
checks:
- correct_callers
- correct_depth
- correct_paths
- correct_source_locations
- valid_response_schema
description: 'Verify that the tool identifies all indirect callers of a selected function
  with depth > 1.

  '
expected:
  callers:
  - depth: 1
    file: main.py
    line: 6
    name: alpha
  - depth: 1
    file: main.py
    line: 12
    name: beta
  - depth: 2
    file: main.py
    line: 18
    name: gamma
    path:
    - gamma
    - alpha
    - target
  - depth: 2
    file: main.py
    line: 24
    name: delta
    path:
    - delta
    - beta
    - target
  status: not_found
expected_message: Symbol definition not found
expected_symbol_name: null
fixture:
  repository: simple-python
  target_symbol: target
input:
  depth: 2
  file_path: 'fixtures/repositories/{''repository'': ''simple-python'', ''target_symbol'':
    ''target''}/main.py'
  repository_path: 'fixtures/repositories/{''repository'': ''simple-python'', ''target_symbol'':
    ''target''}'
must_not:
- epsilon
name: Indirect function caller discovery
performance:
  max_duration_ms: 3000
severity: critical
test_id: REL-CALL-002
tool: find_callers
