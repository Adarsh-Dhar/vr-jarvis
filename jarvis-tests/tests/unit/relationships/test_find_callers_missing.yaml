category: relationship_intelligence
checks:
- proper_error_handling
- meaningful_error_message
- no_crash
- valid_response_schema
description: 'Verify correct error handling when requesting callers for a non-existent
  function.

  '
expected:
  error_type: unknown_symbol
  status: not_found
expected_message: Symbol definition not found
expected_symbol_name: null
fixture:
  repository: simple-python
  target_symbol: does_not_exist
input:
  depth: 1
  file_path: 'fixtures/repositories/{''repository'': ''simple-python'', ''target_symbol'':
    ''does_not_exist''}/main.py'
  repository_path: 'fixtures/repositories/{''repository'': ''simple-python'', ''target_symbol'':
    ''does_not_exist''}'
must_not:
- crash
- empty_callers_list
- fabricated_callers
name: Find callers for missing function
performance:
  max_duration_ms: 1000
severity: critical
test_id: REL-CALL-003
tool: find_callers
