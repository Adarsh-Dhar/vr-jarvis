test_id: FIND_CALLEES-T01
name: Verified find_callees - Analysis
category: verified
tool: find_callees
layer: 1
test_type: T01
description: Verified analysis test for find_callees
fixture: simple-python
verified: true
input:
  target: alpha
  repository_path: fixtures/repositories/simple-python
expected:
  status: not_found
  results: &id001
  - callee: target
    file: main.py
    line: 45
    type: direct
  - callee: helper_function
    file: main.py
    line: 60
    type: direct
must_not:
- placeholder_symbols
- fabricated_callees
