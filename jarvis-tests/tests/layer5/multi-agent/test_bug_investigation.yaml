agent_sequence:
- action: understand_user_intent
  agent: orchestrator
  output: investigation_plan
- action: detect_frameworks
  agent: repository_intelligence
  input: investigation_plan
  output: framework_info
- action: explain_function
  agent: code_understanding
  input: framework_info
  output: auth_logic
- action: trace_call_chain
  agent: relationship_intelligence
  input: auth_logic
  output: call_graph
- action: collect_execution_trace
  agent: runtime_intelligence
  input: call_graph
  output: execution_trace
- action: identify_root_cause
  agent: debugging_intelligence
  input: execution_trace
  output: root_cause
- action: edit_file
  agent: software_engineering
  input: root_cause
  output: fix
- action: run_unit_tests
  agent: testing_verification
  input: fix
  output: test_results
category: multi_agent
checks:
- agent_order_correct
- context_shared
- parallel_execution
- correct_result
- no_duplicate_work
description: Multi-agent bug investigation scenario
expected_outcomes:
- agents_execute_in_correct_order
- context_shared_between_agents
- parallel_execution_where_possible
- root_cause_correctly_identified
- fix_applied_successfully
- tests_pass
layer: 5
name: Multi-Agent - Bug Investigation
scenario:
  name: bug_investigation
  task: Investigate why authentication fails intermittently
severity: critical
test_id: MULTI-BUG-001
test_type: MULTI_AGENT_COORDINATION
