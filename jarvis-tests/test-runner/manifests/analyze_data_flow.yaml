  - fabricated_dependencies

performance:
  max_duration_ms: 2000

limitations:
  - "Static analysis only - no runtime tracing"
  - "May miss flows through intermediate variables"
  - "Does not handle reflection or dynamic dispatch"

required_test_types:
  - T01
  - T02
  - T04
  - T05
  - T07
  - T08
  - T13

metadata:
  oracle: "Hand-written data flow analysis"
  ground_truth_source: "Manual trace of dependency_injection_example()"
  last_updated: "2026-11-01"
