# Tool Manifest: analyze_data_flow
# Ground truth for analyze_data_flow on simple-python fixture

tool: analyze_data_flow
archetype: analysis
fixture: simple-python

input:
  target: dependency_injection_example
  repository_path: fixtures/repositories/simple-python

expected:
  status: ok
  data_flow:
    - source: parameter
      name: service
      flow: through
      target: target
      type: dependency
    - source: return
      from: target
      flow: to
      target: dependency_injection_example
      type: return_value

must_not:
