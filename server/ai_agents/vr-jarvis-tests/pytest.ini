[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    llm: needs a real model (set JARVIS_RUN_LLM=1 and model credentials)
    stress: scale, concurrency and fault-injection tests
    soak: long-running loops (set JARVIS_SOAK=1)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
