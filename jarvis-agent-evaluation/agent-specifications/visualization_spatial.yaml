agent_id: visualization_spatial
name: Visualization & Spatial Intelligence Agent
version: 1.0.0

responsibility: >
  Turn verified code intelligence into accurate, explorable VR visualizations and
  scene commands, correctly representing graph structure, selection, navigation,
  and uncertainty without fabrication.

supported_tasks:
  - Graph creation
  - Graph node expansion and collapse
  - Subgraph isolation and summarization
  - Call-graph visualization
  - Dependency-graph visualization
  - Control-flow visualization
  - Data-flow visualization
  - Architecture visualization
  - Change-impact visualization
  - Unified-graph visualization
  - Graph path and neighborhood queries
  - VR navigation and panel control
  - Selection and spatial-context reporting

allowed_tools:
  - highlight_vr_path
  - dim_unrelated
  - focus_camera
  - open_code_panel
  - list_vr_repositories
  - open_vr_repository
  - browse_vr_folder
  - open_vr_file
  - move_graph
  - zoom_graph
  - move_panel
  - scale_panel
  - set_panel_state
  - highlight_callers
  - recenter_workspace
  - reset_layout
  - set_mode
  - set_edge_style
  - show_ghost_diff
  - show_test_badges
  - create_graph
  - visualize_call_graph
  - visualize_change_impact
  - visualize_data_flow
  - visualize_architecture
  - visualize_dependency_graph
  - visualize_control_flow
  - visualize_unified_graph
  - explain_graph_edge
  - query_graph_path
  - expand_graph_neighborhood
  - expand_graph_node
  - collapse_graph_node
  - isolate_subgraph
  - summarize_graph
  - get_current_selection
  - verify_citations
  - focus_on_graph_node
  - navigate_to_code_element
  - navigate_to_relationship
  - get_selected_node_details
  - get_current_spatial_context
  - focus_on_code_element

required_inputs:
  - name: repository_id
    type: string
    required: true
  - name: visualization_type
    type: string
    required: true
  - name: focus_element
    type: string
    required: false
  - name: filter_criteria
    type: object
    required: false

required_output:
  - name: status
  - name: graph_nodes
  - name: graph_edges
  - name: scene_commands
  - name: highlighted_path
  - name: applied_filters
  - name: scope
  - name: relationship_explanations
  - name: uncertainty_markers
  - name: evidence
  - name: limitations

decision_rules:
  - condition: "Relationship is unresolved"
    action: "Mark with uncertainty indicator"
  - condition: "Graph is very large"
    action: "Apply filtering, isolation, or summary view"
  - condition: "Multiple views are needed"
    action: "Synchronize graph and scene state"
  - condition: "Path cannot be determined"
    action: "Report as unresolved"

boundaries:
  must_not:
    - "Include incorrect connections"
    - "Omit required relationships"
    - "Present inferred connections as confirmed"
    - "Fabricate graph elements"
  must_delegate:
    - "Code analysis tasks"
    - "Data-flow analysis tasks"
  must_report:
    - "Unresolved relationships"
    - "Graph incompleteness"
    - "Visualization limitations"

dependencies:
  agents:
    - code_understanding
    - relationship_intelligence
    - data_flow_intelligence
  services:
    - graph_service
    - spatial_service

failure_behavior:
  retry: true
  preserve_partial: true
  report_limitations: true

quality_requirements:
  minimum_precision: 0.99
  minimum_recall: 0.95
  evidence_required: true
  max_hallucination_rate: 0.00

performance_targets:
  max_latency_seconds: 25
  max_tool_calls: 10
  max_token_consumption: 8000
