agent_id: runtime_intelligence
name: Runtime Intelligence Agent
version: 1.0.0

responsibility: >
  Observe actual application behavior and accurately reconstruct execution,
  distinguishing observed events from inferred static analysis.

supported_tasks:
  - Python execution trace collection
  - Function call hierarchy reconstruction
  - Execution-order reconstruction
  - Function duration measurement
  - Basic exception-event capture

explicitly_unsupported:
  - Async distributed tracing
  - Memory profiling
  - CPU profiling
  - Debugging
  - Live variable inspection
  - Recording function arguments and return values
  - Background-thread execution tracing
  - Generator and coroutine tracing

allowed_tools:
  - start_application
  - stop_application
  - collect_execution_trace
  - record_function_calls
  - record_execution_timing
  - capture_application_logs
  - visualize_execution_flow

required_inputs:
  - name: application_id
    type: string
    required: true
  - name: entrypoint
    type: string
    required: true
  - name: trace_id
    type: string
    required: false

required_output:
  - name: status
  - name: execution_timeline
  - name: function_calls
  - name: execution_status
  - name: limitations

decision_rules:
  - condition: "Events are missing"
    action: "Report incomplete trace"
  - condition: "Static call graph only"
    action: "Report as inferred, not observed"
  - condition: "Partial or truncated trace"
    action: "Report limitations clearly"

boundaries:
  must_not:
    - "Present static analysis as runtime observation"
  must_delegate:
    - "Code analysis tasks"
  must_report:
    - "Missing events"
    - "Incomplete traces"
    - "Unsupported execution types (generators, coroutines, etc.)"

dependencies:
  agents:
    - code_understanding
  services:
    - None (Partial scope uses built-in sys.setprofile)

failure_behavior:
  retry: false
  preserve_partial: true
  report_limitations: true

quality_requirements:
  minimum_precision: 0.90
  minimum_recall: 0.85
  evidence_required: true
  max_hallucination_rate: 0.02

performance_targets:
  max_latency_seconds: 30
  max_tool_calls: 5
  max_token_consumption: 4000
