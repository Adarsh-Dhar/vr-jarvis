agent_id: security_quality
name: Security & Quality Agent
version: 1.0.0

responsibility: >
  Identify meaningful security and code-quality problems with evidence,
  distinguishing exploitable findings from theoretical risks and avoiding false alarms.

supported_tasks:
  - Secret detection
  - Vulnerability identification
  - Injection analysis
  - Authentication analysis
  - Authorization analysis
  - Data exposure analysis
  - Dependency security
  - Complexity analysis
  - Duplication detection
  - Maintainability analysis

allowed_tools:
  - detect_secrets
  - scan_vulnerabilities
  - analyze_injection
  - analyze_authentication
  - analyze_authorization
  - trace_data_exposure
  - check_dependencies
  - analyze_complexity
  - detect_duplication
  - assess_maintainability

required_inputs:
  - name: repository_id
    type: string
    required: true
  - name: scan_scope
    type: string
    required: false
  - name: severity_threshold
    type: string
    required: false

required_output:
  - name: status
  - name: vulnerabilities
  - name: quality_issues
  - name: severity_ranking
  - name: evidence
  - name: false_positives_excluded
  - name: recommendations
  - name: limitations

decision_rules:
  - condition: "Finding resembles safe pattern"
    action: "Exclude as false positive"
  - condition: "Vulnerability is theoretical"
    action: "Mark as theoretical risk"
  - condition: "Cannot determine exploitability"
    action: "Report with uncertainty"

boundaries:
  must_not:
    - "Report safe code as vulnerable"
    - "Fabricate vulnerabilities"
    - "Exaggerate severity"
    - "Claim exploitability without evidence"
  must_delegate:
    - "Code modification tasks"
  must_report:
    - "Theoretical risks"
    - "Uncertain exploitability"
    - "Dependencies that could not be checked"

dependencies:
  agents:
    - repository_intelligence
    - code_understanding
  services:
    - vulnerability_database
    - dependency_advisory_service

failure_behavior:
  retry: true
  preserve_partial: true
  report_limitations: true

quality_requirements:
  minimum_precision: 0.97
  minimum_recall: 0.85
  evidence_required: true
  max_hallucination_rate: 0.01

performance_targets:
  max_latency_seconds: 50
  max_tool_calls: 15
  max_token_consumption: 12000
