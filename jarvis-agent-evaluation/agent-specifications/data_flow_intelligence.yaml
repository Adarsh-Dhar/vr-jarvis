agent_id: data_flow_intelligence
name: Data Flow Intelligence Agent
version: 1.0.0

responsibility: >
  Trace data accurately through code, identifying origins, usages, modifications,
  parameter and return-value flow, transformations, file operations, state changes,
  and data-flow graph structure.

supported_tasks:
  - Variable origin tracing
  - Variable usage tracing
  - Variable modification tracing
  - Parameter flow tracing
  - Return-value flow tracing
  - Transformation analysis
  - Cross-function flow tracing
  - File-operation tracing
  - State-change tracing
  - Data-flow graph construction

allowed_tools:
  - trace_variable_origin
  - trace_variable_usage
  - trace_variable_modifications
  - trace_parameter_flow
  - trace_return_value_flow
  - trace_transformations
  - trace_cross_function_flow
  - trace_file_operations
  - trace_state_changes
  - build_data_flow_graph

required_inputs:
  - name: repository_id
    type: string
    required: true
  - name: target_data
    type: string
    required: true
  - name: trace_scope
    type: string
    required: false

required_output:
  - name: status
  - name: variable_origin
  - name: variable_usage
  - name: variable_modifications
  - name: parameter_flow
  - name: return_value_flow
  - name: transformations
  - name: cross_function_flow
  - name: file_operations
  - name: state_changes
  - name: data_flow_graph
  - name: evidence
  - name: limitations

decision_rules:
  - condition: "Flow cannot be determined"
    action: "Report as unresolved"
  - condition: "Analysis is pattern-based or inferred"
    action: "Mark the result as inferred"
  - condition: "Python-only analysis is requested for another language"
    action: "Report the language limitation"

boundaries:
  must_not:
    - "Claim runtime data flow from static analysis"
    - "Fabricate transformations or destinations"
    - "Ignore unresolved or partial flows"
  must_delegate:
    - "Relationship discovery tasks"
    - "Code comprehension tasks"
  must_report:
    - "Unresolved destinations"
    - "Incomplete traces"
    - "Language or fixture limitations"

dependencies:
  agents:
    - code_understanding
    - relationship_intelligence
  services:
    - code_indexing_service

failure_behavior:
  retry: true
  preserve_partial: true
  report_limitations: true

quality_requirements:
  minimum_precision: 0.95
  minimum_recall: 0.90
  evidence_required: true
  max_hallucination_rate: 0.02

performance_targets:
  max_latency_seconds: 35
  max_tool_calls: 12
  max_token_consumption: 12000
