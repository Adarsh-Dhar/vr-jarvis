agent_id: data_flow
name: Data Flow Intelligence Agent
version: 1.0.0

responsibility: >
  Trace data accurately from origin to destination, identifying transformations,
  sanitization, and sensitive data exposure across code and services.

supported_tasks:
  - Source identification
  - Variable propagation
  - Parameter tracking
  - Return-value tracking
  - Transformation analysis
  - Database flow tracing
  - API flow tracing
  - Sensitive data tracking

allowed_tools:
  - trace_data_flow
  - identify_sources
  - identify_sinks
  - track_transformations
  - detect_sanitization

required_inputs:
  - name: repository_id
    type: string
    required: true
  - name: target_data
    type: string
    required: true
  - name: trace_scope
    type: string
    required: false

required_output:
  - name: status
  - name: source_to_sink_paths
  - name: transformations
  - name: sanitization_points
  - name: sensitive_data_exposure
  - name: evidence
  - name: limitations

decision_rules:
  - condition: "Flow cannot be determined"
    action: "Report as unresolved"
  - condition: "Sensitive data detected"
    action: "Flag and track carefully"

boundaries:
  must_not:
    - "Confuse data with its hash"
    - "Claim certainty for incomplete flows"
  must_delegate:
    - "Code analysis tasks"
  must_report:
    - "Unresolved destinations"
    - "Sensitive data exposure"

dependencies:
  agents:
    - code_understanding
    - relationship_intelligence
  services:
    - data_tracing_service

failure_behavior:
  retry: true
  preserve_partial: true
  report_limitations: true

quality_requirements:
  minimum_precision: 0.95
  minimum_recall: 0.90
  evidence_required: true
  max_hallucination_rate: 0.02

performance_targets:
  max_latency_seconds: 35
  max_tool_calls: 12
  max_token_consumption: 12000
