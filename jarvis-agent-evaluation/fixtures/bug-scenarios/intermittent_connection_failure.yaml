name: intermittent_connection_failure
description: Intermittent database connection failure due to shared connection pool
bug_type: race_condition
severity: high
location:
  file: src/database/connection.py
  line: 35
  function: get_connection
root_cause:
  description: Connection pool is incorrectly shared across multiple threads without proper locking
  vulnerable_code: "global connection_pool; def get_connection(): if not connection_pool: connection_pool = create_pool(); return connection_pool.get()"
reproduction_steps: "Start application with concurrent requests; Send 10 simultaneous login requests; Observe intermittent connection errors after 5-6 requests; Errors appear as \"Connection already closed\" or \"Invalid connection state\""
expected_fix:
  description: Use thread-local connection pools or proper connection pool locking
  fixed_code: "from threading import local; thread_local = local(); def get_connection(): if not hasattr(thread_local, 'connection_pool'): thread_local.connection_pool = create_pool(); return thread_local.connection_pool.get()"
test_case:
  file: tests/test_connection.py
  function: test_concurrent_connections
  expected_to_fail: true
  should_pass_after_fix: true
ground_truth:
  is_bug: true
  reproducible: true
  fixable: true
