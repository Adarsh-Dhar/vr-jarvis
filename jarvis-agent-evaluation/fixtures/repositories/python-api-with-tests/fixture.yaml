    function: app
build_system:
  type: pip
  configuration:
    package_manager: pip
    build_command: pip install -r requirements.txt
    test_command: pytest
dependencies:
  runtime:
    - Python 3.10+
    - fastapi
    - uvicorn
  development:
    - pytest
    - pytest-asyncio
monorepo_structure: None
