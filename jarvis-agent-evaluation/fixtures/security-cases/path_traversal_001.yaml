name: path_traversal_001
description: Path traversal vulnerability in file access
vulnerability_type: path_traversal
severity: high
cwe: CWE-22
location:
  file: src/api/files.py
  line: 18
  function: read_file
vulnerability:
  description: User input is used in file path without validation
  vulnerable_code: "with open(f'/uploads/{filename}', 'r') as f:"
  parameters:
    - name: filename
      source: user_input
      type: string
  exploit_scenario: "Attacker can access arbitrary files: filename: '../../../etc/passwd'"
  fix:
    description: Validate and sanitize file paths
    fixed_code: "safe_path = os.path.normpath(filename).lstrip('/'); with open(os.path.join('/uploads', safe_path), 'r') as f:"
  evidence:
    - type: source_location
      file: src/api/files.py
      line: 18
      code_snippet: "with open(f'/uploads/{filename}', 'r') as f:"
    - type: vulnerability_pattern
      pattern: path concatenation without validation
ground_truth:
  is_vulnerable: true
  false_positive: false
  exploitable: true
