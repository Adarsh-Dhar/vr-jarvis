name: xss_001
description: Cross-site scripting vulnerability in user input display
vulnerability_type: xss
severity: high
cwe: CWE-79
location:
  file: src/components/UserProfile.tsx
  line: 28
  function: renderBio
vulnerability:
  description: User input is rendered without sanitization, allowing script injection
  vulnerable_code: "return <div>{user.bio}</div>"
  parameters:
    - name: user.bio
      source: user_input
      type: string
  exploit_scenario: "Attacker can inject malicious JavaScript: bio: '<script>alert(document.cookie)</script>'"
  fix:
    description: Use DOMPurify or React's built-in escaping
    fixed_code: "return <div>{DOMPurify.sanitize(user.bio)}</div>"
  evidence:
    - type: source_location
      file: src/components/UserProfile.tsx
      line: 28
      code_snippet: "return <div>{user.bio}</div>"
    - type: vulnerability_pattern
      pattern: unsanitized user input in JSX
ground_truth:
  is_vulnerable: true
  false_positive: false
  exploitable: true
