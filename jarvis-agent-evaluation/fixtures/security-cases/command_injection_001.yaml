name: command_injection_001
description: Command injection in system call
vulnerability_type: command_injection
severity: critical
cwe: CWE-78
location:
  file: src/utils/file_handler.py
  line: 45
  function: delete_file
vulnerability:
  description: User input is directly passed to os.system without sanitization
  vulnerable_code: "os.system(f'rm {filename}')"
  parameters:
    - name: filename
      source: user_input
      type: string
  exploit_scenario: "Attacker can execute arbitrary commands: filename: 'file.txt; rm -rf /'"
  fix:
    description: Use subprocess with list arguments or shell=False
    fixed_code: "subprocess.run(['rm', filename], check=True)"
  evidence:
    - type: source_location
      file: src/utils/file_handler.py
      line: 45
      code_snippet: "os.system(f'rm {filename}')"
    - type: vulnerability_pattern
      pattern: string concatenation in os.system
ground_truth:
  is_vulnerable: true
  false_positive: false
  exploitable: true
