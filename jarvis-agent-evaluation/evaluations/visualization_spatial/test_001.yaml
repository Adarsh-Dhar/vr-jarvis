      label: helper
      file: src/helper.py
      line: 3
      type: function
  edges:
    - from: main
      to: helper
      type: calls
      line: 8
  metadata:
    total_nodes: 2
    total_edges: 1
    max_depth: 1
expected_result:
  visualization_generated: true
  format_correct: true
  nodes_correct: true
  edges_correct: true
  metadata_accurate: true
fixture:
