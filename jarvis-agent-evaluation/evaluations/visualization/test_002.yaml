test_id: AG-VIS-002
agent: visualization
scenario: contract_validation
layer: layer1_contract
severity: critical
description: Validate visualization contract and configuration
input:
  task: "Validate contract"
  context:
    validation_type: contract_check
expected_output:
  contract:
    agent_id: visualization
    version: 1.0.0
    responsibilities:
      - graph_construction
      - filtering
      - path_highlighting
    allowed_tools:
      - graph_builder
      - filter_engine
      - path_highlighter
    boundaries:
      must_not:
        - modify_production_code
        - execute_code
      must_include:
        - source_locations
        - legend
      must_report:
        - graph_too_large
        - filtering_incomplete
    quality_requirements:
      min_precision: 0.90
      min_recall: 0.85
      max_hallucination_rate: 0.03
expected_result:
  contract_valid: true
  all_responsibilities_defined: true
  all_tools_allowed: true
  all_boundaries_defined: true
  quality_metrics_defined: true
fixture:
  type: none
evidence_requirements: []
boundary_checks:
  - must_not: modify_production_code
  - must_not: execute_code
  - must_include: source_locations
  - must_include: legend
