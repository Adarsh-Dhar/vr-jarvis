test_id: AG-STR-003
agent: runtime_intelligence
scenario: stress_complex_async_trace
layer: layer7_stress
severity: high
description: Handles reconstruction of complex async trace with many parallel operations
input:
  task: "Reconstruct the execution timeline from this trace"
  context:
    trace: complex_async_trace
    additional_context:
      total_events: 1000
      parallel_threads: 50
      async_operations: 200
expected_output:
  timeline:
    total_duration_ms: 5000
    parallel_threads: 50
    async_operations: 200
  call_hierarchy:
    depth: 15
    total_functions: 100
    root_function: main
  performance:
    duration_seconds: < 60
    memory_usage_mb: < 800
  limitations:
    - "Detailed event correlation limited to top 20 threads"
    - "Deep async chain analysis truncated at depth 15"
expected_result:
  timeline_reconstructed: true
  call_hierarchy_built: true
  performance_within_limits: true
  limitations_reported: true
  no_timeout: true
fixture:
  type: runtime_trace
  name: complex_async_trace
evidence_requirements:
  - claim: timeline
    requires_evidence: true
  - claim: limitations
    requires_evidence: true
boundary_checks:
  - must_not: modify_runtime_system
  - must_not: execute_trace_operations
